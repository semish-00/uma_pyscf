[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uma-pyscf"
version = "0.1.0.dev0"
description = "Reproducible UMA fine-tuning on GPU4PySCF wB97M-V/def2-TZVPD labels for H/Si/Ge/Cl gas-phase molecules."
readme = "README.md"
requires-python = ">=3.10"
# Beyond the config parser the core library is standard library only by design.
# Scientific dependencies (pyscf, gpu4pyscf, ase, fairchem) belong to the
# modules that need them and are declared when those modules are added.
# PyYAML arrives with the sampling milestone: configs are YAML by project
# convention, and they are read with `yaml.safe_load` only.
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["ruff", "mypy", "types-PyYAML"]
dataset = ["ase>=3.26,<4", "ase-db-backends>=0.11,<1"]
inference = [
  "ase>=3.26,<4",
  "ase-db-backends>=0.11,<1",
  "fairchem-core==2.22.0",
]

[project.scripts]
uma-pyscf = "uma_pyscf.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uma_pyscf = ["py.typed"]

[tool.ruff]
line-length = 99
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# Match the import order already used across the repository: one alphabetical
# run per section, with `import x` and `from x import y` interleaved.
force-sort-within-sections = true

[tool.mypy]
python_version = "3.10"
files = ["src"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
