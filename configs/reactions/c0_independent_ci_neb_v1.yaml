schema_version: 1
path_set_id: c0_independent_ci_neb_v1
created: "2026-09-01"
description: >-
  Base-UMA CI-NEB paths for the four reaction families that are independent of
  engineering-50. Endpoints come from si_ge_reaction_endpoints_v1. Each final
  path retains endpoints, the climbing image and its neighbors, then fills to
  nine structures by mass-weighted arc-length coverage. The final force target
  is a sampling-path criterion, not a precision barrier criterion; minimum
  climbing steps prevent premature acceptance.

endpoint_set_id: si_ge_reaction_endpoints_v1
reaction_ids:
  - sihcl3_to_sicl2_hcl
  - gehcl3_to_gecl2_hcl
  - sih3cl_to_sihcl_h2
  - geh3cl_to_gehcl_h2

model:
  name: uma-s-1p2
  task: omol
  fairchem_core_version: "2.22.0"
  inference_settings: batch
  seed: 47

neb:
  image_count: 17
  interpolation: idpp
  method: aseneb
  spring_constant_ev_per_angstrom2: 0.10
  coarse_maxstep_angstrom: 0.08
  final_maxstep_angstrom: 0.03
  coarse_fmax_ev_per_angstrom: 0.10
  coarse_steps: 500
  final_min_steps: 50
  final_fmax_ev_per_angstrom: 0.15
  final_steps: 1500

selection:
  count_per_reaction: 9
  require_endpoints: true
  require_climbing_image: true
  require_climbing_neighbors: true

filters:
  covalent_factor: 0.65
  bond_factor: 1.3
  allow_fragments: true
  duplicate_decimals: 3
