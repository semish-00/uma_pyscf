# Every entry intentionally remains pending_scientific_review. The 12 probes
# establish CPU/GPU numerical agreement at one geometry; they do not establish
# state ordering, stability across geometries, or scientific suitability for a
# released training set. Therefore this registry documents the candidates but
# approves none of them.
