# P2.4 reference example: the QC thresholds a label record is judged against.
#
# Every value here is a scientific condition, which is why it is in a versioned
# config and not in the code: `src/uma_pyscf/qc/` owns *how* a record is checked
# and this file owns *what it is checked against* (structure design section 4).
# A QC verdict is only reproducible if the file that produced it can be named,
# so the report embeds this config verbatim and fingerprints its content.
#
# The two ceilings under `electronic` are sanity limits, not science. A label
# whose gradient exceeds them is a structure the sampler should not have
# proposed or a calculation that went wrong; they are not a statement about
# which forces a model should learn. The scientific thresholds are the S^2
# deviation and the geometry factors.
#
# Existing versions are never edited. A different set of conditions becomes
# example_qc_v2.yaml, and every record's QC history records which version
# produced its verdict.
schema_version: 1
qc_id: example_qc_v1
created: "2026-08-22"
description: >-
  Reference QC thresholds for the H/Si/Ge/Cl gas-phase label set, used as the
  P2.4 example and regression fixture. Geometry factors match the P2.2 sampling
  defaults so that a structure accepted before the calculation is not rejected
  after it for a reason the sampler never applied.

electronic:
  # Always true in schema version 1; stated so the report records that the run
  # required convergence rather than leaving it to be inferred. A v1 config that
  # sets this to false is refused: there is no supported way to accept an
  # unconverged label.
  require_converged: true

  # |s2 - s2_target|, dimensionless. Applies to open-shell records only
  # (multiplicity > 1). 0.05 is the spin-contamination tolerance the Part I
  # ladder used for its doublet cases.
  s2_max_abs_deviation: 0.05

  # An open-shell record that does not report <S^2> cannot be checked for spin
  # contamination, so it is rejected rather than passed. Fail closed.
  require_s2_for_open_shell: true

  # Per-component ceiling on |dE/dR| in hartree/bohr. 1.0 hartree/bohr is about
  # 51 eV/A: far above any equilibrium or moderately displaced geometry, and
  # reached only by a collision or a broken calculation.
  gradient_max_abs_hartree_per_bohr: 1.0

  # Frobenius norm of the whole gradient matrix, hartree/bohr. Bounds the total
  # rather than the worst component, so a structure with many moderately large
  # forces is caught as well.
  gradient_norm_max_hartree_per_bohr: 2.0

geometry:
  # The same factors as configs/sampling/example_bond_scan_v1.yaml's filters,
  # with one deliberate difference: bond_factor is the 1.3 default here rather
  # than that config's 1.45. This example is not scan-specific, and a QC run on
  # scan output states its own bond_factor.
  covalent_factor: 0.65
  bond_factor: 1.3
  allow_fragments: false

  # Decimal places the interatomic-distance fingerprint is rounded to before two
  # geometries are compared. Duplicates are state-qualified: the same geometry in
  # a different charge or multiplicity is a different calculation, not a
  # duplicate, exactly as in sampling.
  duplicate_decimals: 3
