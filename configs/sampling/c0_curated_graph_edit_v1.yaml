schema_version: 1
sampling_id: c0_curated_graph_edit_pool_v1
created: "2026-09-04"
description: >-
  Score-independent C0 graph-edit tranche from six manually reviewed,
  valence-saturated neutral-singlet dimer topologies and positional isomers.
  Each parent contributes three fixed small Cartesian displacements. These
  records are exploratory unknown-reaction coverage, not inferred electronic
  states or dissociated fragments.

structures:
  - {id: sigeh5cl_cl_on_si, xyz_path: structures/c0_curated_graph_edit_seeds_v1/sigeh5cl_cl_on_si.xyz}
  - {id: sigeh4cl2_one_each, xyz_path: structures/c0_curated_graph_edit_seeds_v1/sigeh4cl2_one_each.xyz}
  - {id: sigeh4cl2_both_si, xyz_path: structures/c0_curated_graph_edit_seeds_v1/sigeh4cl2_both_si.xyz}
  - {id: sigeh4cl2_both_ge, xyz_path: structures/c0_curated_graph_edit_seeds_v1/sigeh4cl2_both_ge.xyz}
  - {id: si2h4cl2_geminal, xyz_path: structures/c0_curated_graph_edit_seeds_v1/si2h4cl2_geminal.xyz}
  - {id: ge2h4cl2_geminal, xyz_path: structures/c0_curated_graph_edit_seeds_v1/ge2h4cl2_geminal.xyz}

operations:
  - &graph_edit_displacements
    kind: cartesian_displacement
    structure: sigeh5cl_cl_on_si
    charge: 0
    multiplicity: 1
    sigma_angstrom: 0.03
    count: 3
    seed: 2026090401
  - <<: *graph_edit_displacements
    structure: sigeh4cl2_one_each
    seed: 2026090402
  - <<: *graph_edit_displacements
    structure: sigeh4cl2_both_si
    seed: 2026090403
  - <<: *graph_edit_displacements
    structure: sigeh4cl2_both_ge
    seed: 2026090404
  - <<: *graph_edit_displacements
    structure: si2h4cl2_geminal
    seed: 2026090405
  - <<: *graph_edit_displacements
    structure: ge2h4cl2_geminal
    seed: 2026090406

filters:
  covalent_factor: 0.65
  bond_factor: 1.3
  allow_fragments: false
  duplicate_decimals: 3
