# One closed-shell SiH4 geometry for the first production label-pipeline run.
schema_version: 1
sampling_id: gpu_label_smoke_v1
created: "2026-08-31"
description: >-
  A single 5% Si-H stretch used to verify sample -> label -> QC on the fixed
  SoftBank GPU environment. It is engineering evidence, not a released label.

structures:
  - id: sih4_seed
    xyz_path: structures/sih4_seed_example.xyz

operations:
  - kind: bond_scan
    structure: sih4_seed
    charge: 0
    multiplicity: 1
    anchor_index: 0
    moved_index: 1
    factors: [1.05]

filters:
  covalent_factor: 0.65
  bond_factor: 1.3
  allow_fragments: false
  duplicate_decimals: 3
