  - {id: sigeh5cl, xyz_path: structures/c0_moderate_md_seeds_v1/sigeh5cl.xyz}

operations:
  - &local_soft {kind: cartesian_displacement, structure: sih3cl, charge: 0, multiplicity: 1, sigma_angstrom: 0.025, count: 6, seed: 2026095100}
  - &local_hard {kind: cartesian_displacement, structure: sih3cl, charge: 0, multiplicity: 1, sigma_angstrom: 0.080, count: 6, seed: 2026095106}
  - &scan {kind: bond_scan, structure: sih3cl, charge: 0, multiplicity: 1, anchor_index: 0, moved_index: 2, factors: [0.82, 0.94, 1.08, 1.25]}
  - {<<: *local_soft, structure: geh3cl, seed: 2026095200}
  - {<<: *local_hard, structure: geh3cl, seed: 2026095206}
  - {<<: *scan, structure: geh3cl}
  - {<<: *local_soft, structure: sih2cl2, seed: 2026095300}
  - {<<: *local_hard, structure: sih2cl2, seed: 2026095306}
  - {<<: *scan, structure: sih2cl2}
  - {<<: *local_soft, structure: geh2cl2, seed: 2026095400}
  - {<<: *local_hard, structure: geh2cl2, seed: 2026095406}
  - {<<: *scan, structure: geh2cl2}
  - {<<: *local_soft, structure: si2h6, seed: 2026095500}
  - {<<: *local_hard, structure: si2h6, seed: 2026095506}
  - {<<: *scan, structure: si2h6}
  - {<<: *local_soft, structure: ge2h6, seed: 2026095600}
  - {<<: *local_hard, structure: ge2h6, seed: 2026095606}
  - {<<: *scan, structure: ge2h6}
  - {<<: *local_soft, structure: si2h5cl, seed: 2026095700}
  - {<<: *local_hard, structure: si2h5cl, seed: 2026095706}
  - {<<: *scan, structure: si2h5cl}
  - {<<: *local_soft, structure: si2h4cl2, seed: 2026095800}
  - {<<: *local_hard, structure: si2h4cl2, seed: 2026095806}
  - {<<: *scan, structure: si2h4cl2}
  - {<<: *local_soft, structure: ge2h5cl, seed: 2026095900}
  - {<<: *local_hard, structure: ge2h5cl, seed: 2026095906}
  - {<<: *scan, structure: ge2h5cl}
  - {<<: *local_soft, structure: ge2h4cl2, seed: 2026096000}
  - {<<: *local_hard, structure: ge2h4cl2, seed: 2026096006}
  - {<<: *scan, structure: ge2h4cl2}
  - {<<: *local_soft, structure: sigeh6, seed: 2026096100}
  - {<<: *local_hard, structure: sigeh6, seed: 2026096106}
  - {<<: *scan, structure: sigeh6}
  - {<<: *local_soft, structure: sigeh5cl, seed: 2026096200}
