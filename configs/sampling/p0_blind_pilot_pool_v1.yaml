schema_version: 1
sampling_id: p0_blind_pilot_pool_v1
created: "2026-09-05"
description: >-
  Acquisition-independent 192-candidate pilot around twelve training-side C0
  parents. T0-reserved parents are absent. Cartesian RNGs are fixed and no UMA,
  PFP, teacher residual, or T0 metric enters generation.

structures:
  - {id: sih3cl, xyz_path: structures/calibration_local_relaxed_v1/sih3cl.xyz}
  - {id: geh3cl, xyz_path: structures/calibration_local_relaxed_v1/geh3cl.xyz}
  - {id: sih2cl2, xyz_path: structures/calibration_local_relaxed_v1/sih2cl2.xyz}
  - {id: geh2cl2, xyz_path: structures/calibration_local_relaxed_v1/geh2cl2.xyz}
  - {id: si2h6, xyz_path: structures/calibration_local_relaxed_v1/si2h6.xyz}
  - {id: ge2h6, xyz_path: structures/calibration_local_relaxed_v1/ge2h6.xyz}
  - {id: si2h5cl, xyz_path: structures/c0_moderate_md_seeds_v1/si2h5cl.xyz}
  - {id: si2h4cl2, xyz_path: structures/c0_moderate_md_seeds_v1/si2h4cl2.xyz}
  - {id: ge2h5cl, xyz_path: structures/c0_moderate_md_seeds_v1/ge2h5cl.xyz}
