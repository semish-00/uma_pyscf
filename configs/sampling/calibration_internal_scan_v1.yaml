schema_version: 1
sampling_id: calibration_internal_scan_v1
created: "2026-09-01"
derived_from: calibration_local_relax_seeds_v1
description: >-
  Score-independent C0 bond scan and dissociation candidates generated from the
  six base-UMA-relaxed calibration parents. The four chlorinated parents scan
  one M-Cl bond; the two dimers scan one terminal M-H bond.

structures:
  - {id: sih3cl, xyz_path: structures/calibration_local_relaxed_v1/sih3cl.xyz}
  - {id: geh3cl, xyz_path: structures/calibration_local_relaxed_v1/geh3cl.xyz}
  - {id: sih2cl2, xyz_path: structures/calibration_local_relaxed_v1/sih2cl2.xyz}
  - {id: geh2cl2, xyz_path: structures/calibration_local_relaxed_v1/geh2cl2.xyz}
  - {id: si2h6, xyz_path: structures/calibration_local_relaxed_v1/si2h6.xyz}
  - {id: ge2h6, xyz_path: structures/calibration_local_relaxed_v1/ge2h6.xyz}

operations:
  - kind: bond_scan
    structure: sih3cl
    charge: 0
    multiplicity: 1
    anchor_index: 0
    moved_index: 4
    factors: &scan_factors [0.75, 0.85, 0.95, 1.10, 1.25, 1.45, 1.70, 2.00]
  - kind: bond_scan
    structure: geh3cl
    charge: 0
    multiplicity: 1
    anchor_index: 0
    moved_index: 4
    factors: *scan_factors
  - kind: bond_scan
    structure: sih2cl2
    charge: 0
    multiplicity: 1
    anchor_index: 0
    moved_index: 4
    factors: *scan_factors
  - kind: bond_scan
    structure: geh2cl2
    charge: 0
    multiplicity: 1
    anchor_index: 0
    moved_index: 4
    factors: *scan_factors
  - kind: bond_scan
    structure: si2h6
    charge: 0
    multiplicity: 1
    anchor_index: 0
    moved_index: 2
    factors: *scan_factors
  - kind: bond_scan
    structure: ge2h6
    charge: 0
    multiplicity: 1
    anchor_index: 0
    moved_index: 2
    factors: *scan_factors

filters:
  covalent_factor: 0.65
  bond_factor: 1.3
  allow_fragments: true
  duplicate_decimals: 3
