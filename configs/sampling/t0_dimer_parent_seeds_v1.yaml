schema_version: 1
sampling_id: t0_dimer_parent_seeds_v1
created: "2026-09-05"
description: >-
  Six neutral closed-shell eight-atom dimer parents reserved exclusively for
  the fixed T0 test. Their compositions/topologies and parent IDs are absent
  from C0, engineering-50, and the P0 training pool. They must never be used
  for training or acquisition-guided resampling.

structures:
