  - {id: t0_sigeh3cl3_si1_ge2, xyz_path: structures/t0_dimer_parents_v1/t0_sigeh3cl3_si1_ge2.xyz}
  - {id: t0_sigeh2cl4_si1_ge3, xyz_path: structures/t0_dimer_parents_v1/t0_sigeh2cl4_si1_ge3.xyz}

