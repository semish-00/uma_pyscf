schema_version: 1
md_set_id: c0_moderate_uma_md_v1
created: "2026-09-03"
description: >-
  Short base-UMA NVT Langevin trajectories for blind C0 candidate generation.
  The thermostat targets compensate for the effective heating measured in the
  preflight. These trajectories sample finite-temperature distortions; they
  are not equilibrated trajectories or physical-property simulations.

model:
  name: uma-s-1p2
  task: omol
  fairchem_core_version: "2.22.0"
  inference_settings: batch
  seed: 53

optimization:
  coarse_fmax_ev_per_angstrom: 0.08
  coarse_steps: 300
  final_fmax_ev_per_angstrom: 0.02
  final_steps: 500
  maxstep_angstrom: 0.05

dynamics:
  timestep_fs: 0.25
  friction_per_fs: 0.02
  equilibration_steps: 400
  production_steps: 1600
  save_interval_steps: 20
  temperatures_K: [180, 300, 450, 650]
  seeds: [2026090301, 2026090302]
  force_temperature: true
  max_centered_radius_angstrom: 8.0
  temperature_mean_ratio_bounds: [0.5, 2.5]

selection:
  frames_per_trajectory: 5
  minimum_completed_trajectories: 27

filters:
  covalent_factor: 0.65
  bond_factor: 1.3
  allow_fragments: false
  duplicate_decimals: 3
