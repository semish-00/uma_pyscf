# First multi-composition production-pipeline engineering set.
#
# These 50 neutral closed-shell candidates test deterministic generation,
# both resource tiers, process isolation, QC, and resume. They are engineering
# evidence only and must not be released as a scientific dataset.
schema_version: 1
sampling_id: engineering_50_v1
created: "2026-08-31"
description: >-
  Fifty deterministic H/Si/Ge/Cl candidates: eight sigma=0.04 A and two
  sigma=0.12 A Cartesian displacements for each of five validated seed
  compositions, spanning the five-atom and eight-atom resource tiers.

structures:
  - id: sih4_seed
    xyz_path: structures/sih4_seed_example.xyz
  - id: geh4_seed
