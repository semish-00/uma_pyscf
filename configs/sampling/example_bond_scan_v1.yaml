# P2.2 reference example: the smallest config that exercises every operation
# kind the sampling schema defines, on one seed structure.
#
# It is committed because the unit tests generate from this file and compare the
# two output records byte for byte across two runs; it is therefore also the
# worked example of the config format. Numbers carry their unit in the key name,
# lengths are angstrom, and nothing here depends on when it is run.
#
# Existing versions are never edited. A different set of conditions becomes
# example_bond_scan_v2.yaml, and the manifest records which version produced it.
schema_version: 1
sampling_id: example_bond_scan_v1
created: "2026-08-22"
description: >-
  SiH4 bond scan, seeded Cartesian displacements, and a neutral/cation state
  pair, used as the P2.2 reference example and regression fixture.

structures:
  - id: sih4_seed
    # Relative to this file. Tetrahedral SiH4 built the same way as the Part I
    # validation ladder: Si at the origin, ligands along (+-1,+-1,+-1)/sqrt(3).
    xyz_path: structures/sih4_seed_example.xyz

operations:
  # Tier 1, one internal coordinate: stretch and compress a single Si-H bond,
  # moving only the ligand so the scan changes nothing else.
  - kind: bond_scan
    structure: sih4_seed
    charge: 0
    multiplicity: 1
    anchor_index: 0
    moved_index: 1
    factors: [0.85, 1.15, 1.30]

  # Tier 1, all internal coordinates at once: small seeded Gaussian jitter with
  # the rigid translation removed.
  - kind: cartesian_displacement
    structure: sih4_seed
    charge: 0
    multiplicity: 1
    sigma_angstrom: 0.04
    count: 2
    seed: 20260813

  # Tier 2, same geometry in two electronic states: the neutral singlet and the
  # cation doublet.
  - kind: state_expansion
    structure: sih4_seed
    states:
      - charge: 0
        multiplicity: 1
      - charge: 1
        multiplicity: 2

filters:
  covalent_factor: 0.65
  # Not the 1.3 default. A Si-H bond of 1.480 A is already longer than the
  # covalent radii sum of 1.42 A, so at the default the x1.30 scan point (1.924 A)
  # would sit outside the bonding cutoff (1.846 A) and be rejected as a
  # dissociated fragment -- exactly the stretched geometry the scan exists to
  # produce. 1.45 keeps the whole scan connected (cutoff 2.059 A) while still
  # separating a genuinely broken bond.
  bond_factor: 1.45
  allow_fragments: false
  duplicate_decimals: 3
