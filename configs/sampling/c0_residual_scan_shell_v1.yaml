description: >-
  Diagnostic C0 follow-up around the highest base-UMA force-residual record in
  each of the three hardest internal-scan parent groups. One fixed 0.02 and one
  fixed 0.05 angstrom shell point are generated per parent. This six-record
  batch is outside the blind C0 180 quota and is grouped with its source parent;
  dissociated geometries are intentional. No T0 record or 10k-model score is used.

