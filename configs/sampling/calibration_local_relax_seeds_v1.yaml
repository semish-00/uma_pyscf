schema_version: 1
sampling_id: calibration_local_relax_seeds_v1
created: "2026-09-01"
description: >-
  Six neutral-singlet parents not used by engineering_50. Approximate input
  geometries are relaxed by base UMA before any C0 displacement is generated.

structures:
  - {id: sih3cl, xyz_path: structures/sih3cl_seed_calibration.xyz}
  - {id: geh3cl, xyz_path: structures/geh3cl_seed_calibration.xyz}
  - {id: sih2cl2, xyz_path: structures/sih2cl2_seed_calibration.xyz}
  - {id: geh2cl2, xyz_path: structures/geh2cl2_seed_calibration.xyz}
  - {id: si2h6, xyz_path: structures/si2h6_seed_calibration.xyz}
  - {id: ge2h6, xyz_path: structures/ge2h6_seed_calibration.xyz}

operations:
  - {kind: state_expansion, structure: sih3cl, states: [{charge: 0, multiplicity: 1}]}
  - {kind: state_expansion, structure: geh3cl, states: [{charge: 0, multiplicity: 1}]}
  - {kind: state_expansion, structure: sih2cl2, states: [{charge: 0, multiplicity: 1}]}
  - {kind: state_expansion, structure: geh2cl2, states: [{charge: 0, multiplicity: 1}]}
  - {kind: state_expansion, structure: si2h6, states: [{charge: 0, multiplicity: 1}]}
  - {kind: state_expansion, structure: ge2h6, states: [{charge: 0, multiplicity: 1}]}

filters:
  covalent_factor: 0.65
  bond_factor: 1.3
  allow_fragments: false
  duplicate_decimals: 3
