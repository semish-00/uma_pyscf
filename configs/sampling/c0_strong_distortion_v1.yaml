schema_version: 1
sampling_id: c0_strong_distortion_pool_v1
created: "2026-09-03"
description: >-
  Score-independent C0 high-energy tail from controlled compression and
  elongation of one terminal M-H or M-Cl bond in six neutral
  closed-shell dimer parents. Factors remain on the connected side of the
  geometry bond cutoff; large forces are retained for teacher QC rather than
  rejected by candidate generation.

structures:
  - {id: si2h5cl, xyz_path: structures/c0_moderate_md_seeds_v1/si2h5cl.xyz}
  - {id: si2h4cl2, xyz_path: structures/c0_moderate_md_seeds_v1/si2h4cl2.xyz}
  - {id: ge2h5cl, xyz_path: structures/c0_moderate_md_seeds_v1/ge2h5cl.xyz}
  - {id: ge2h4cl2, xyz_path: structures/c0_moderate_md_seeds_v1/ge2h4cl2.xyz}
  - {id: sigeh6, xyz_path: structures/c0_moderate_md_seeds_v1/sigeh6.xyz}
  - {id: sigeh5cl, xyz_path: structures/c0_moderate_md_seeds_v1/sigeh5cl.xyz}

operations:
  - &si_cl_scan
    kind: bond_scan
    structure: si2h5cl
    charge: 0
    multiplicity: 1
    anchor_index: 0
    moved_index: 2
    factors: &distortion_factors [0.70, 0.78, 1.22]
  - <<: *si_cl_scan
    structure: si2h4cl2
  - <<: *si_cl_scan
    structure: ge2h5cl
  - <<: *si_cl_scan
    structure: ge2h4cl2
  - <<: *si_cl_scan
    structure: sigeh6
  - <<: *si_cl_scan
    structure: sigeh5cl

filters:
  covalent_factor: 0.65
  bond_factor: 1.3
  allow_fragments: false
  duplicate_decimals: 3
