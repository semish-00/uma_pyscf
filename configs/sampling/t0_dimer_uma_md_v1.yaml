schema_version: 1
md_set_id: t0_dimer_uma_md_v1
created: "2026-09-05"
description: >-
  Score-blind base-UMA NVT Langevin trajectories for six T0-only neutral
  singlet parents. These trajectories are finite-temperature candidate
  generators, not physical-property simulations. No teacher/model residual is
  used for frame selection.

model:
  name: uma-s-1p2
  task: omol
  fairchem_core_version: "2.22.0"
  inference_settings: batch
  seed: 71

optimization:
  coarse_fmax_ev_per_angstrom: 0.08
  coarse_steps: 300
  final_fmax_ev_per_angstrom: 0.02
  final_steps: 500
  maxstep_angstrom: 0.05

dynamics:
  timestep_fs: 0.25
  friction_per_fs: 0.02
  equilibration_steps: 400
  production_steps: 1600
  save_interval_steps: 20
  temperatures_K: [180, 300, 450, 650]
  seeds: [2026090501, 2026090502]
  force_temperature: true
  max_centered_radius_angstrom: 8.0
  temperature_mean_ratio_bounds: [0.5, 2.5]

selection:
  frames_per_trajectory: 5
  minimum_completed_trajectories: 42

filters:
  covalent_factor: 0.65
  bond_factor: 1.3
  allow_fragments: false
  duplicate_decimals: 3
